# Generated by tools/ci/gen_config.py from src/podcast_agent/config.py and .env.example. Do not edit.
# Every setting the agent reads: the environment variable, the Settings field, its default and meaning.
settings:
  - env: LLM_PROVIDER
    field: provider
    default: "auto"
    help: "auto = anthropic if ANTHROPIC_API_KEY is set, else openai if OPENAI_API_KEY+OPENAI_MODEL, else offline"
  - env: ANTHROPIC_API_KEY
    field: anthropic_api_key
    default: "null"
  - env: ANTHROPIC_MODEL
    field: anthropic_model
    default: "claude-sonnet-5-5"
  - env: ANTHROPIC_FAST_MODEL
    field: anthropic_fast_model
    default: "claude-haiku-5-5"
  - env: ANTHROPIC_WORKSPACE_ID
    field: anthropic_workspace_id
    default: "null"
    help: "Only if your key isn't scoped to a workspace: Console → Settings → Workspaces → ID (wrkspc_...)"
  - env: BEDROCK_MODEL
    field: bedrock_model
    default: "null"
    help: "Claude on Amazon Bedrock (LLM_PROVIDER=bedrock). Credentials come from the AWS chain: AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, AWS_PROFILE with ~/.aws mounted, or an IAM role."
  - env: BEDROCK_FAST_MODEL
    field: bedrock_fast_model
    default: "null"
  - env: AWS_REGION
    field: aws_region
    default: "us-east-1"
  - env: PROMPT_CACHE
    field: prompt_cache
    default: "true"
  - env: ANTHROPIC_EFFORT
    field: anthropic_effort
    default: "low"
    help: "Claude effort: low | medium | high | xhigh | max ('none' for models without effort)"
  - env: ANTHROPIC_THINKING_SUMMARIES
    field: thinking_summaries
    default: "true"
    help: "Log Claude's thinking summaries as 'thinking' events in the trace"
  - env: OPENAI_API_KEY
    field: openai_api_key
    default: "null"
    help: "OpenAI or any OpenAI-compatible server (vLLM, LM Studio)"
  - env: OPENAI_BASE_URL
    field: openai_base_url
    default: "https://api.openai.com/v1"
  - env: OPENAI_MODEL
    field: openai_model
    default: "null"
  - env: OPENAI_FAST_MODEL
    field: openai_fast_model
    default: "null"
  - env: OPENAI_MAX_TOKENS_PARAM
    field: openai_max_tokens_param
    default: "max_tokens"
  - env: OLLAMA_BASE_URL
    field: ollama_base_url
    default: "http://localhost:11434/v1"
    help: "Local model via Ollama (docker compose --profile local-llm up -d ollama)"
  - env: OLLAMA_MODEL
    field: ollama_model
    default: "llama3.1:8b"
  - env: LLM_TEMPERATURE
    field: temperature
    default: "0.2"
    help: "Sampling temperature for OpenAI-compatible and Ollama models (Claude 5.5 models take none)"
  - env: LLM_CACHE
    field: cache_enabled
    default: "true"
    help: "Local response cache for model calls (skip repeat calls during development)"
  - env: LLM_CACHE_DIR
    field: cache_dir
    default: ".cache/llm"
    help: "Where it lives. Leave this unset: the default is .cache/llm locally and /cache/llm in the Docker image, whose working directory isn't writable by the container's user."
  - env: SEARCH_PROVIDER
    field: search_provider
    default: "mock"
    help: "mock | tavily | none"
  - env: TAVILY_API_KEY
    field: tavily_api_key
    default: "null"
  - env: KB_PATH
    field: kb_path
    default: "data/knowledge_base.json"
  - env: MOCK_WEB_PATH
    field: mock_web_path
    default: "data/mock_web_index.json"
  - env: SUMMARY_LENGTH_MODE
    field: summary_length_mode
    default: "spec"
    help: "spec (200-300 words) | adaptive (shorter floor for very short episodes)"
  - env: AGENT_TODAY
    field: today
    default: "<today's date>"
    help: "pin 'today' for reproducible fact-checks, e.g. 2026-10-13"
