# Argo CD project: what the podcast-agent Applications may deploy, and where.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: podcast-agent
  namespace: argocd
spec:
  description: Podcast Agent API and workers, one Application per environment
  sourceRepos:
    - https://github.com/Organized-AI/podcast-agent.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: podcast-agent-dev
    - server: https://kubernetes.default.svc
      namespace: podcast-agent-prod
  # The only cluster-scoped kind is the Namespace that CreateNamespace=true creates; Argo CD checks
  # that against this list too. Destinations above still limit it to the two environment namespaces.
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
  namespaceResourceWhitelist:
    - { group: "", kind: ConfigMap }
    - { group: "", kind: Service }
    - { group: "", kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: batch, kind: CronJob }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: keda.sh, kind: ScaledObject }
    - { group: keda.sh, kind: TriggerAuthentication }
    - { group: external-secrets.io, kind: ExternalSecret }
    - { group: monitoring.coreos.com, kind: PrometheusRule }
  orphanedResources:
    warn: true
