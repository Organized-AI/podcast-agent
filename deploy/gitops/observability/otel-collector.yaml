apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: MLFLOW_BASIC_AUTH
              valueFrom:
                secretKeyRef: { name: mlflow-secrets, key: COLLECTOR_BASIC_AUTH }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prometheus, containerPort: 8889 }
          readinessProbe:
            httpGet: { path: /, port: 13133 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
      volumes:
        - name: config
          configMap: { name: otel-collector }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: prometheus, port: 8889, targetPort: prometheus }
