# The lab's Prometheus: scrapes the Collector's exporter, evaluates deploy/observability/prometheus/alerts.yml (the
# same file Compose and the chart's PrometheusRule use) and sends alerts to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
