# What MLflow needs beyond its chart: a tailnet port and its users.
apiVersion: v1
kind: Service
metadata:
  name: mlflow-ui
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: mlflow, app.kubernetes.io/instance: mlflow }
  ports:
    - { name: http, port: 5000, targetPort: http, nodePort: 30500 }
---
# Creates MLflow's users: "collector", which may edit experiment 0 and nothing else, and a personal account that
# may read it. A Job's pod template can't be changed in place, so Argo CD deletes and recreates this Job on each sync
# (Force=true,Replace=true), which re-runs it. That is safe: the script leaves existing users and grants as they are.
# No ttlSecondsAfterFinished: a Job that deleted itself would be recreated by self-heal and run again a day later.
apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app.kubernetes.io/name: mlflow-bootstrap }    # the mlflow NetworkPolicy admits this label
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: ghcr.io/mlflow/mlflow:v3.17.1-full@sha256:190306b1739b9646d6d39333594334b69ba14ab843db927712c790b50892f262
          command: ["python", "/bootstrap/bootstrap.py"]
          env:
            - { name: MLFLOW_URL, value: "http://mlflow:5000" }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: ADMIN_PASSWORD } }
            - name: COLLECTOR_PASSWORD
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: COLLECTOR_PASSWORD } }
            - name: USER_NAME
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: USER_NAME, optional: true } }
            - name: USER_PASSWORD
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: USER_PASSWORD, optional: true } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: script, mountPath: /bootstrap }
      volumes:
        - name: script
          configMap: { name: mlflow-bootstrap }
