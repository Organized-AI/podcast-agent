# What MLflow needs beyond its chart: a tailnet port and the Collector's user.
apiVersion: v1
kind: Service
metadata:
  name: mlflow-ui
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: mlflow, app.kubernetes.io/instance: mlflow }
  ports:
    - { name: http, port: 5000, targetPort: http, nodePort: 30500 }
---
# Creates the "collector" user and lets it edit experiment 0 only; safe to run again (see the script).
apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: ghcr.io/mlflow/mlflow:v3.17.1-full@sha256:190306b1739b9646d6d39333594334b69ba14ab843db927712c790b50892f262
          command: ["python", "/bootstrap/bootstrap.py"]
          env:
            - { name: MLFLOW_URL, value: "http://mlflow:5000" }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: ADMIN_PASSWORD } }
            - name: COLLECTOR_PASSWORD
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: COLLECTOR_PASSWORD } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: script, mountPath: /bootstrap }
      volumes:
        - name: script
          configMap: { name: mlflow-bootstrap }
