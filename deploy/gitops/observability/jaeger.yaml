apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
          args: ["--config=file:/etc/jaeger/config.yaml"]
          env:
            - { name: OTEL_TRACES_SAMPLER, value: always_off }   # Jaeger's own spans would only add noise here
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: query, containerPort: 16686 }
          readinessProbe:
            httpGet: { path: /status, port: 13133 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 1536Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/jaeger }
      volumes:
        - name: config
          configMap: { name: jaeger }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: query, port: 16686, targetPort: query }
---
# Published on the kind node (30686) for `tailscale serve`; the node port listens on the host's 127.0.0.1 only.
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: query, port: 16686, targetPort: query, nodePort: 30686 }
