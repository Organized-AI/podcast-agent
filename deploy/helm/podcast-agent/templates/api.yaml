{{- if .Values.api.enabled }}
{{- $sel := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "podcast-agent.fullname" . }}-api
  labels:
    {{- include "podcast-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "podcast-agent.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "podcast-agent.selector" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "podcast-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "podcast-agent.selector" $sel | nindent 14 }}
      containers:
        - name: api
          {{- include "podcast-agent.containerCommon" . | nindent 10 }}
          args: ["serve", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- include "podcast-agent.volumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "podcast-agent.fullname" . }}-api
  labels:
    {{- include "podcast-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "podcast-agent.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "podcast-agent.fullname" . }}-api
  labels:
    {{- include "podcast-agent.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "podcast-agent.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "podcast-agent.fullname" . }}-api
  labels:
    {{- include "podcast-agent.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "podcast-agent.selector" $sel | nindent 6 }}
{{- end }}
{{- end }}
