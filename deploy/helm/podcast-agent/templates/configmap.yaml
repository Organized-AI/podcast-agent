apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "podcast-agent.fullname" . }}
  labels:
    {{- include "podcast-agent.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.worker.enabled }}
  QUEUE_URI: {{ .Values.worker.queueUri | quote }}
  OUTPUT_URI: {{ .Values.worker.outputUri | quote }}
  AWS_REGION: {{ .Values.worker.awsRegion | quote }}
  WORKER_MAX_ATTEMPTS: {{ .Values.worker.maxAttempts | quote }}
  {{- end }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: "podcast-agent"
  OTEL_TRACES_SAMPLER: {{ .Values.otel.sampler | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.otel.samplerArg | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ printf "k8s.namespace.name=%s,service.namespace=%s" .Release.Namespace .Release.Name | quote }}
  DEPLOY_ENV: {{ .Values.otel.environment | default .Release.Namespace | quote }}
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: {{ .Values.otel.captureContent | quote }}
  {{- end }}
