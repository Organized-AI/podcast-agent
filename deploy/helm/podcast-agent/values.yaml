# One image, two roles: `serve` (API) and `worker` (queue consumer). See docs/DEPLOYMENT.md.
image:
  repository: ghcr.io/organized-ai/podcast-agent
  tag: "0.2.0"
  digest: ""                 # sha256:… — takes precedence over tag; set per environment by GitOps
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  # IRSA: grant SQS receive/delete, S3 put/get on the output bucket, Bedrock invoke (if used).
  annotations: {}
  #  eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/podcast-agent

# Non-secret configuration, rendered into a ConfigMap and loaded as environment variables.
config:
  LLM_PROVIDER: anthropic
  ANTHROPIC_MODEL: claude-sonnet-5-5
  ANTHROPIC_FAST_MODEL: claude-haiku-5-5
  SEARCH_PROVIDER: mock
  MAX_CLAIMS: "8"
  MAX_STEPS_PER_CLAIM: "4"
  LLM_CACHE_DIR: /cache/llm
  # Per-episode budget at list prices; an episode over it raises PodcastAgentCostBudgetExceeded (docs/runbooks/cost-budget.md).
  COST_BUDGET_USD: "0.20"
  COST_BUDGET_MODE: warn

secrets:
  # Secret with ANTHROPIC_API_KEY (and optionally TAVILY_API_KEY). Created by External Secrets
  # when externalSecrets.enabled=true, otherwise must already exist in the namespace.
  name: podcast-agent-secrets
  optional: false            # true only where no key is needed (the offline provider)

externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  remoteKey: prod/podcast-agent   # JSON secret with the keys above

# OpenTelemetry: off unless enabled. Pods send OTLP/HTTP to a Collector (see docs/OBSERVABILITY.md).
otel:
  enabled: false
  endpoint: http://otel-collector.observability.svc.cluster.local:4318
  environment: ""              # deployment.environment.name, e.g. dev or prod
  sampler: parentbased_traceidratio
  samplerArg: "1.0"            # keep every trace; lower it when traffic grows
  captureContent: false        # prompts and transcript text in spans: never where content is confidential

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

api:
  enabled: true
  replicaCount: 2
  port: 8080
  service:
    type: ClusterIP          # NodePort only for a local lab cluster (deploy/gitops/lab)
    nodePort: null           # 30000-32767 when type is NodePort
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  enabled: true
  queueUri: https://sqs.us-east-1.amazonaws.com/123456789012/podcast-agent-jobs
  outputUri: s3://podcast-agent-outputs/reports
  awsRegion: us-east-1
  maxAttempts: 3
  # Long enough to finish an in-flight episode after SIGTERM (worker drains, then exits).
  terminationGracePeriodSeconds: 900
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "1", memory: 768Mi }
  keda:
    enabled: true          # requires KEDA in the cluster; otherwise set replicaCount
    minReplicas: 0         # scale to zero when the queue is empty
    maxReplicas: 20        # cap below the model provider's rate limit
    messagesPerReplica: 2
    pollingInterval: 15
    cooldownPeriod: 300
  replicaCount: 1          # used only when keda.enabled=false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Synthetic canary: a CronJob that sends a long, claim-dense episode through the API. Its metrics carry
# podcast_agent.traffic="canary", so a change that makes episodes more expensive shows on the canary before a customer
# episode (docs/runbooks/cost-budget.md).
canary:
  enabled: false
  schedule: "* * * * *"
  transcript: data/canary/canary_roundtable.json
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 200m, memory: 192Mi }

# Incident bridge: Alertmanager's webhook receiver. It opens an enriched GitHub issue per alert group and closes it
# with the timeline when the alert resolves (src/podcast_agent/ops/incident.py). Without the token Secret it runs dry.
incidentBridge:
  enabled: false
  port: 8080
  repository: Organized-AI/podcast-agent
  githubTokenSecret: incident-bridge-github   # key "token": a token that can write issues; created out of band
  env: {}                 # PROMETHEUS_URL, JAEGER_URL, ARGOCD_URL, *_UI_URL, MLFLOW_EXPERIMENT_ID (see the module)
  egressPorts: []         # ports of the in-cluster sources above, for the NetworkPolicy
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

# Prometheus Operator alert rules (the same rules as deploy/observability/prometheus/alerts.yml).
# The agent pushes OTLP to a Collector, so scrape the Collector's Prometheus exporter, not the pods.
monitoring:
  prometheusRule:
    enabled: false
    labels: {}               # e.g. release: kube-prometheus-stack, to match the operator's ruleSelector

networkPolicy:
  enabled: true            # ingress only to the API port; egress only DNS + HTTPS
