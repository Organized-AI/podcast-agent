# OpenTelemetry Collector for local development: OTLP in, traces to Jaeger, metrics to Prometheus.
# The agent sends OTLP/HTTP to :4318 (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch: {}
  # Defense in depth for shared environments: drop GenAI content even if a client turns capture on.
  # Add it to the traces pipeline below wherever transcripts must never reach the backend.
  attributes/drop-content:
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.tool.call.arguments, action: delete }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
