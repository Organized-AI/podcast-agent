# OpenTelemetry Collector for local development: OTLP in, traces to Jaeger and MLflow, metrics to Prometheus.
# The agent sends OTLP/HTTP to :4318 (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318) and knows
# nothing about the backends: the traces pipeline below fans each span out to both exporters.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch: {}
  # Defense in depth for shared environments: drop GenAI content even if a client turns capture on.
  # Add it to the traces pipeline below wherever transcripts must never reach the backend.
  attributes/drop-content:
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.tool.call.arguments, action: delete }

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # MLflow's tracking server takes OTLP/HTTP traces at /v1/traces (MLflow 3.6+, SQL backend store) and files
  # them under the experiment named in the header. Jaeger answers "where did the time go"; MLflow shows the
  # same spans as an agent run (tool calls, verdicts, token usage). Each exporter keeps its own retry queue,
  # so MLflow being down never holds up Jaeger.
  otlp_http/mlflow:
    endpoint: ${env:MLFLOW_OTLP_ENDPOINT:-http://mlflow:5000}
    headers:
      x-mlflow-experiment-id: ${env:MLFLOW_EXPERIMENT_ID:-0}
    compression: gzip
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger, otlp_http/mlflow]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
