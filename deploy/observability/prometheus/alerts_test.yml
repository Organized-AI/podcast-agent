# promtool unit tests for alerts.yml: `make observability-check` (runs promtool from the pinned Prometheus image).
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: a partial episode pages
    interval: 1m
    input_series:
      - series: 'podcast_agent_episodes_total{service_name="podcast-agent",podcast_agent_episode_status="ok"}'
        values: "0+1x20"
      - series: 'podcast_agent_episodes_total{service_name="podcast-agent",podcast_agent_episode_status="partial"}'
        values: "0x10 1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: PodcastAgentEpisodesFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: PodcastAgentEpisodesFailing
        exp_alerts:
          - exp_labels: { severity: page, service_name: podcast-agent }
            exp_annotations:
              summary: Episodes are finishing with failed steps
              description: >-
                1 episode(s) finished failed or partial in the last 15 minutes.
                Open the episode's invoke_agent span in Jaeger; failed steps carry the exception.

  - name: unverifiable share needs both a high share and enough volume
    interval: 1m
    input_series:
      # 60 verdicts an hour, 45 of them unverifiable: fires after 30 minutes
      - series: 'podcast_agent_verdicts_total{service_name="podcast-agent",podcast_agent_verdict="unverifiable"}'
        values: "0+0.75x120"
      - series: 'podcast_agent_verdicts_total{service_name="podcast-agent",podcast_agent_verdict="verified"}'
        values: "0+0.25x120"
      # a quiet second service: 4 verdicts an hour, all unverifiable, never enough volume to alert
      - series: 'podcast_agent_verdicts_total{service_name="quiet",podcast_agent_verdict="unverifiable"}'
        values: "0+0.0667x120"
    alert_rule_test:
      - eval_time: 80m
        alertname: PodcastAgentUnverifiableShareHigh
        exp_alerts:
          - exp_labels: { severity: ticket, service_name: podcast-agent }
            exp_annotations:
              summary: Most claims are coming back unverifiable
              description: >-
                75% of verdicts in the last hour were unverifiable. Search may be down,
                or the knowledge base may be stale for current topics.

  - name: tool errors open a ticket
    interval: 1m
    input_series:
      - series: 'podcast_agent_tool_calls_total{service_name="podcast-agent",gen_ai_tool_name="web_search",outcome="error"}'
        values: "0+1x20"
      - series: 'podcast_agent_tool_calls_total{service_name="podcast-agent",gen_ai_tool_name="search_knowledge_base",outcome="ok"}'
        values: "0+5x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: PodcastAgentToolErrors
        exp_alerts:
          - exp_labels: { severity: ticket, service_name: podcast-agent, gen_ai_tool_name: web_search }
            exp_annotations:
              summary: web_search is failing
              description: 15 tool errors in 15 minutes; fact-checks fall back to the remaining tools.

  - name: failed model calls page
    interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{service_name="podcast-agent",gen_ai_provider_name="anthropic",error_type="RateLimitError"}'
        values: "0+1x20"
      - series: 'gen_ai_client_operation_duration_seconds_count{service_name="podcast-agent",gen_ai_provider_name="anthropic"}'
        values: "0+10x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: PodcastAgentModelErrors
        exp_alerts:
          - exp_labels: { severity: page, service_name: podcast-agent, gen_ai_provider_name: anthropic }
            exp_annotations:
              summary: Model calls are failing (anthropic)
              description: 10 failed model calls in 10 minutes; check provider status, keys and rate limits.

  - name: a canary episode over budget opens a ticket, which resolves after five clean minutes
    interval: 1m
    input_series:
      # starts at 0 (the agent exports every series at zero), then two canary episodes go over budget
      - series: 'podcast_agent_budget_violations_total{service_name="podcast-agent",deployment_environment_name="dev",podcast_agent_budget_usd="0.15",podcast_agent_traffic="canary"}'
        values: "0x5 1 2 2x12"
      - series: 'podcast_agent_budget_violations_total{service_name="podcast-agent",deployment_environment_name="dev",podcast_agent_budget_usd="0.15",podcast_agent_traffic="live"}'
        values: "0x19"
    alert_rule_test:
      - eval_time: 5m
        alertname: PodcastAgentCostBudgetExceeded
        exp_alerts: []
      - eval_time: 7m
        alertname: PodcastAgentCostBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: ticket
              service_name: podcast-agent
              deployment_environment_name: dev
              podcast_agent_budget_usd: "0.15"
            exp_annotations:
              summary: Episodes are costing more than their $0.15 budget
              description: >-
                2 episode(s) went over the per-episode cost budget in the last 5 minutes.
                The incident bridge opens a GitHub issue with the spend by step, the most expensive trace and the last deploy.
              runbook_url: https://github.com/Organized-AI/podcast-agent/blob/main/docs/runbooks/cost-budget.md
      - eval_time: 13m
        alertname: PodcastAgentCostBudgetExceeded
        exp_alerts: []

  - name: slow model calls open a ticket after ten minutes; a fast model never does
    interval: 1m
    input_series:
      # every Sonnet call lands between 20.48 s and 40.96 s, so p95 interpolates to about 40 s
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_request_model="claude-sonnet-5-5",le="20.48"}'
        values: "0x40"
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_request_model="claude-sonnet-5-5",le="40.96"}'
        values: "0+2x40"
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_request_model="claude-sonnet-5-5",le="+Inf"}'
        values: "0+2x40"
      # every Haiku call finishes under 1.28 s
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_request_model="claude-haiku-5-5",le="1.28"}'
        values: "0+5x40"
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_request_model="claude-haiku-5-5",le="+Inf"}'
        values: "0+5x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: PodcastAgentModelLatencyHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: PodcastAgentModelLatencyHigh
        exp_alerts:
          - exp_labels: { severity: ticket, gen_ai_request_model: claude-sonnet-5-5 }
            exp_annotations:
              summary: p95 model latency above 30s for claude-sonnet-5-5
              description: Slow model calls back up the queue; consider a faster tier for extraction steps.

  - name: self-corrections need both a high share and enough calls
    interval: 1m
    input_series:
      # 60 model calls an hour, half of them rejected and retried
      - series: 'gen_ai_client_operation_duration_seconds_count{service_name="podcast-agent"}'
        values: "0+1x120"
      - series: 'podcast_agent_self_corrections_total{service_name="podcast-agent",podcast_agent_step_name="extract_notes"}'
        values: "0+0.5x120"
      # a quiet second service: every output retried, but only 6 calls an hour
      - series: 'gen_ai_client_operation_duration_seconds_count{service_name="quiet"}'
        values: "0+0.1x120"
      - series: 'podcast_agent_self_corrections_total{service_name="quiet",podcast_agent_step_name="summarize"}'
        values: "0+0.1x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: PodcastAgentSelfCorrectionsHigh
        exp_alerts: []
      - eval_time: 80m
        alertname: PodcastAgentSelfCorrectionsHigh
        exp_alerts:
          - exp_labels: { severity: ticket, service_name: podcast-agent }
            exp_annotations:
              summary: More than a quarter of model outputs are being rejected and retried
              description: A prompt or model change may have broken the output format; compare against the eval baseline.
