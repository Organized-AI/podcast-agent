[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-agent"
version = "0.1.0"
description = "Agentic podcast show-notes generator: summaries, key notes and fact-checking with a reasoning trace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "anthropic>=0.40",
  "httpx>=0.27",
  "rich>=13",
  "rapidfuzz>=3.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
aws = ["boto3>=1.34"]

[project.scripts]
podcast-agent = "podcast_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade. Broad `except Exception` is deliberate where a
# step/job failure must be isolated (pipeline executor, worker loop, CLI entry point).
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
