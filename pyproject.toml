[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-agent"
version = "0.1.0"
description = "Agentic podcast show-notes generator: summaries, key notes and fact-checking with a reasoning trace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jordan Hill" }]
dependencies = [
  "pydantic>=2.7",
  "anthropic>=1.13",
  "httpx>=0.27",
  "rich>=13",
  "rapidfuzz>=3.9",
  "fastapi>=0.143",  # native OpenTelemetry server spans and HTTP metrics
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.urls]
Repository = "https://github.com/Organized-AI/podcast-agent"
Guide = "https://podcast-agent-guide.jordan-691.workers.dev"

[project.scripts]
podcast-agent = "podcast_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
podcast_agent = ["py.typed"]

# --- tests: strict and hermetic (conftest.py blocks outbound network) ------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
timeout = 60
filterwarnings = ["error", "ignore::DeprecationWarning:httpx.*", "ignore::ResourceWarning"]

[tool.coverage.run]
source = ["podcast_agent"]
branch = true
patch = ["subprocess"]  # measure child processes too (the telemetry setup test runs in one)

[tool.coverage.report]
# A ratchet: raise it when coverage goes up, never lower it.
fail_under = 83
show_missing = false
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]

# --- lint -----------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["website", "samples"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, bandit, simplify, ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "E501",    # line length is the formatter's job; long prompt strings read better unbroken
  "B008",    # FastAPI dependency defaults use function calls by design
  "S311",    # `random` only drives mock-search failure injection, never security
  "RUF001",  # prompts and reports intentionally use typographic quotes and dashes
  "RUF002",
  "RUF003",
  "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # asserts and fake credentials are what tests are made of
"tools/**" = ["S603", "S607"]                    # CI helpers call git and helm by name

# --- types ----------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
packages = ["podcast_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
