# docker compose run --rm agent                         → process data/transcripts → ./output
# docker compose --profile api up api                   → HTTP API on :8080
# docker compose --profile worker up worker             → drain ./queue/inbox → ./output/jobs
# docker compose --profile local-llm up -d ollama       → local model (then LLM_PROVIDER=ollama)
x-agent: &agent
  build: .
  image: podcast-agent:local
  env_file:
    - path: .env
      required: false
  environment:
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
  volumes:
    - ./data:/app/data:ro
    - ./output:/app/output
    - agent-cache:/cache

services:
  agent:
    <<: *agent
    command: ["run", "data/transcripts", "--out", "output"]

  api:
    <<: *agent
    profiles: ["api"]
    command: ["serve", "--port", "8080"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *agent
    profiles: ["worker"]
    command: ["worker", "--queue", "dir:///app/queue", "--output", "/app/output/jobs"]
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
      - ./queue:/app/queue
      - agent-cache:/cache

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

volumes:
  agent-cache: {}
  ollama: {}
