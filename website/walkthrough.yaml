# The Walkthrough tab and docs/WRITEUP.md are built from this file: make walkthrough
# Present mode shows one stop at a time (say and ask are speaker notes); the write-up shows them all.
# Markup: `code` and **bold** only. {tests} is filled from samples/proof/pytest.txt. show: either view + anchor (a place in the guide) or href (a link).
present:
  kicker: Walkthrough · Seekr FDE panel
  title: The podcast agent, from the brief to production
  lead: Eleven stops, each with what to say, what to show and, where it applies, something to run live. Every number links
    to the evidence in this guide.
writeup:
  title: From a take-home to an agent you can operate
  byline: Jordan Hill · Organized AI · October 2026
  intro:
  - 'This is the Seekr forward deployed engineer take-home: what the brief asked for, what I built, how I built it, and
    what I learned along the way.'
  - 'Each section ends with the lesson I took from it and why it matters. Every number links to evidence in this guide:
    a captured run, a CI job or a pull request.'
stops:
- title: The brief, and what I delivered
  claim: Seekr asked for an agent that turns raw podcast transcripts into fact-checked show notes, plus a deployment strategy.
    Every requirement maps to code, and everything in this walkthrough links to its evidence.
  facts:
  - value: '10'
    label: requirements, each mapped to the file that meets it
  - value: '5'
    label: agent steps the model can plan
  - value: '4'
    label: model providers (Anthropic, Bedrock, OpenAI, Ollama), plus an offline mode
  - value: '4'
    label: sample transcripts, JSON and timestamped text
  learned:
    lesson: Build to the spec first, then make it operable.
    why: 'v0.1.0 met the brief: summary, key notes, a fact-check table and a reasoning log, in Docker. A mentor''s review
      showed that a customer needs more than a working agent. They need to run it, trust it and change it safely. So most
      of v0.2.0 is operations, not features, and that is the part of the job a forward deployed engineer owns.'
  say:
  - 'It''s for producers who publish show notes and need every factual claim checked: a 200–300 word summary, five takeaways,
    quotes checked word for word, a fact-check table marked ✅ ⚠️ ❓, and a readable reasoning log.'
  - I built it to the spec first, as v0.1.0. Then I made it operable, as v0.2.0.
  - 'This guide is the evidence: the Audit trail is a real Claude run, and every card links to a CI job, a pull request
    or a captured run.'
  show:
  - label: Learning path › The brief
    view: path
    anchor: m1
  - label: FIG. 1 · System map
    view: path
    anchor: map
  - label: Where each requirement lives
    href: https://github.com/Organized-AI/podcast-agent#where-each-requirement-lives
  ask:
  - q: Who is this for, and what matters to them?
    a: Producers and editors across many client brands. Minutes of latency are fine; a wrong "fact" in published show notes
      is a brand problem. So it's asynchronous and queue-based, every run keeps a full audit trail, and the agent drafts
      while a person publishes. The review screen is designed, not built.
  - q: What changes for audio instead of transcripts?
    a: 'One step in front: speech-to-text with speaker labels (AssemblyAI, Amazon Transcribe, or Whisper with a diarizer)
      that writes the same timestamped, speaker-labeled format. The rest of the pipeline doesn''t change.'
- title: 'Run it: transcripts in, report out'
  claim: The model writes the plan, code validates it, and the steps run with every decision logged. A run can be re-checked
    later from its own files.
  facts:
  - value: '4'
    label: episodes in the committed Claude run (Sonnet 5.5 + Haiku 5.5)
  - value: '19'
    label: claims fact-checked
  - value: 36 / 36
    label: audit checks pass on that run
  - value: SHA-256
    label: of every input, report and the structured trace, in the run manifest
  learned:
    lesson: Let the model plan, but never let the run depend on it.
    why: 'The planner chooses which steps to run, the summary strategy, how many claims to extract and the fact-checker''s
      tool budget. It can also return a bad plan, so a deterministic validator repairs it and a fallback plan exists. Every
      other output is checked against a schema and business rules, with the error fed back for up to three attempts. A step
      that still fails is isolated: what depends on it is skipped, and the report comes out with warnings. The model makes
      the decisions; code enforces the contract.'
  say:
  - Haiku writes the plan. In the Claude run it skipped normalization on the three clean JSON transcripts, and set a budget
    of 2–6 tool calls per claim. Sonnet writes the summary and notes and verifies the claims; Haiku extracts them.
  - The summary writes the transcript to Sonnet's prompt cache, and the notes read it back at 5% of the input price.
  - '`podcast-agent audit` re-checks a finished run from its files: hashes, quotes verbatim at their timestamp, every claim
    grounded in its transcript line, confidence within the evidence cap.'
  show:
  - label: Audit trail › Episodes
    view: audit
    anchor: au-eps
  - label: Learning path › The plan
    view: path
    anchor: m3
  - label: Audit trail › Trace
    view: audit
    anchor: au-trace
  run:
    cmd: "# the published, signed image; with no API key in .env it runs offline\ndocker run --rm -t --env-file .env -v\
      \ \"$PWD/output:/app/output\" \\\n  ghcr.io/organized-ai/podcast-agent:v0.2.0 run data/transcripts/ep002_ai_healthcare.json\
      \ --out output\ndocker run --rm -t -v \"$PWD/output:/app/output\" ghcr.io/organized-ai/podcast-agent:v0.2.0 audit\
      \ output"
    expect: 'The reasoning trace streams by: the plan, each step, every tool call and verdict. `output/report.md` has the
      summary, notes and fact-check table, and the audit re-checks the run from its files. With Claude an episode costs
      cents: the committed run measured $0.05–$0.10 each at list prices.'
  ask:
  - q: What if the model returns garbage?
    a: 'Schema and business-rule validation, the error fed back, up to three attempts. If an attempt was valid it is accepted
      with a warning; if none was, the step fails and is isolated, and the report still comes out. The plan and the verdicts
      have deterministic fallbacks: a fallback plan, and ❓ for a person.'
  - q: How long can a transcript be?
    a: Single pass up to 15,000 words, about 1.5 to 2 hours. Beyond that the planner switches to map-reduce summarization.
- title: Fact-checks with evidence
  claim: Each claim gets a verdict, the confidence its evidence allows, and the sources behind it. When the evidence isn't
    there, it is ❓ and a person decides.
  facts:
  - value: 6 · 6 · 7
    label: ✅ verified · ⚠️ outdated or inaccurate · ❓ unverifiable, in the committed Claude run
  - value: '18'
    label: dated facts in the local knowledge base
  - value: 2–6
    label: tool calls a claim may use, budgeted by the plan
  - value: in code
    label: where confidence is capped by the evidence
  learned:
    lesson: Confidence has to come from evidence, not from the model.
    why: 'A model will state 90% about anything. Capping confidence in code by what the evidence supports, and defaulting
      to ❓ for a person, is what makes a verdict something an editor can act on. The first real bug was this kind: a prediction
      whose deadline hadn''t passed was marked ⚠️ instead of ❓ (#13). The committed Claude run predates the fix, so its
      "humans on Mars before 2040" is still ⚠️ there; current code marks it ❓.'
  say:
  - 'The verifier is a tool-using loop: the knowledge base first, then web search when the evidence is thin or time-sensitive.
    The tools are read-only and allow-listed.'
  - Verdicts cite evidence ids, and the audit checks each confidence against its evidence cap. A forward-looking prediction
    is ❓ until its deadline passes.
  - Search here is a mock index, so runs are reproducible; production points it at a real search API.
  show:
  - label: Audit trail › Fact-checks
    view: audit
    anchor: au-ledger
  - label: Learning path › One claim, step by step
    view: path
    anchor: m8
  - label: Learning path › Verdicts and confidence
    view: path
    anchor: m9
  ask:
  - q: What happens when search is down?
    a: It retries with backoff, then reports the failure to the agent as an observation. The agent falls back to the knowledge
      base and lowers its confidence. `MOCK_SEARCH_FAILURE_RATE` demonstrates it.
  - q: Can it run air-gapped?
    a: Yes, with a local model (Ollama or a self-hosted, OpenAI-compatible server) and `SEARCH_PROVIDER=none`, so verification
      uses only the dated knowledge base, a JSON file the customer controls.
- title: 'How I know it''s right: evals and a judge'
  claim: Every pull request is scored against labeled claims. A live suite with Claude is scheduled nightly, and a rubric
    judge grades the summaries.
  facts:
  - value: 19 / 19
    label: offline gates, on every pull request
  - value: 14 / 14
    label: live gates with Claude
  - value: 25 / 25
    label: labeled verdicts right with Claude (24 / 25 offline)
  - value: '1'
    label: bug found in the judge itself, by chasing its own flag (#51)
  learned:
    lesson: Evaluate the evaluator.
    why: 'All 19 offline gates and all 14 live gates passed, and the rubric judge still flagged a summary for inventing
      speaker roles (#51). Tracing it back, the roles were in the transcript: the judge had been given a copy with the names
      but not the roles. The agent was right and the judge was wrong. A judge is code too. It needs the same inputs as the
      thing it grades, and tests of its own.'
  say:
  - '25 labeled claims cover every verdict and the edge cases. The offline suite gates every pull request and catches code
    regressions: validation, the verdict rules, the #13 policy.'
  - 'The live suite runs Sonnet 5.5 and Haiku 5.5 against a baseline; a drop of more than 0.05 fails it. Confidence is deliberately
    conservative: Brier 0.033, with the evidence caps keeping it below the hit rate.'
  - 'The judge averaged 0.83. Its "invented speaker roles" turned out to be its own input: it saw names without roles. Fixed
    with a test in PR #62; the next live run confirms it.'
  show:
  - label: Audit trail › Evals
    view: audit
    anchor: au-evals
  - label: 'Proof: the live run with Claude'
    view: audit
    anchor: pf-evals-live
  - label: 'Issue #51'
    href: https://github.com/Organized-AI/podcast-agent/issues/51
  ask:
  - q: Why trust an LLM judge?
    a: 'Not blindly. It''s gated nightly, never on pull requests: two of the 14 live gates are a judge score of at least
      0.7 and at most two invented facts. And #51 is the reason to test the judge too: it was wrong because its input was.'
  - q: How do you stop a prompt change from regressing?
    a: 'Not with the offline suite: the offline provider doesn''t read prompts. A prompt change is caught by the live suite,
      run by hand on the branch before merging (`gh workflow run nightly-evals.yml --ref <branch>`), or by the nightly run
      after it.'
- title: 'How it was built: issues, pull requests, gates'
  claim: A mentor reviewed v0.1.0 and found six gaps. Each one is closed in the repository, not in a plan.
  facts:
  - value: '37'
    label: pull requests merged, this walkthrough's included
  - value: '29'
    label: issues tracked; all closed but #51, which waits on the next live run
  - value: '7'
    label: required checks on main
  - value: '{tests}'
    label: tests, 84% coverage, 83% floor
  learned:
    lesson: A check nobody is required to pass isn't a gate.
    why: 'v0.1.0 ran tests in CI, but nothing required them to pass, and the Helm chart was rendered but never installed.
      Making the PR Gate required, and installing the chart for real with Argo CD on a kind cluster, turned claims into
      evidence. The kind test caught a real deploy bug (PR #36), and the fuzzer''s first input crashed the JSON parser (#49).
      Neither would have shown up in a demo.'
  say:
  - 'v0.1.0 was 14 commits pushed straight to main. Since #22 everything goes through a pull request, and rulesets make
    that the only way in: squash-only, seven required checks, no new high-severity CodeQL alert.'
  - The PR Gate covers lint, types, the tests, the offline evals, the Docker run, Helm for every environment and the observability
    stack end to end.
  - 'Security scanning runs on every pull request: CodeQL, gitleaks, zizmor, Trivy and dependency review. With fuzzing,
    signed releases and the Best Practices badge in place, the OpenSSF Scorecard went from 6.8 to 7.7.'
  show:
  - label: v0.2.0 › Review of v0.1.0
    view: release
    anchor: rl-review
  - label: Audit trail › Build and test
    view: audit
    anchor: au-proof
  - label: Merged pull requests
    href: https://github.com/Organized-AI/podcast-agent/pulls?q=is%3Apr+is%3Amerged
  run:
    cmd: gh pr checks 56 -R Organized-AI/podcast-agent
    expect: 'Every check on the open deploy pull request: the same gates any change has to pass.'
  ask:
  - q: Who reviews, with one maintainer?
    a: 'That''s an honest gap: no change has a second reviewer, and Scorecard says so. The gates are the reviewer I can
      automate; a team adds required reviews to the ruleset.'
  - q: Did the gates catch anything real?
    a: 'Yes. The kind test caught a deploy bug (PR #36). The fuzzer crashed the JSON parser on its first input, which turned
      bad transcripts into HTTP 500s instead of 422s (#49). CodeQL found a ReDoS in the transcript parser, now covered by
      a regression test.'
- title: 'Ship once: one image, one digest'
  claim: Each code merge builds one multi-arch image with an SBOM and signed provenance. A release re-tags that digest,
    so prod runs the bytes dev tested, and anyone can check.
  facts:
  - value: '1'
    label: digest in dev and prod at the v0.2.0 release (sha256:67a18fc8…)
  - value: SLSA
    label: provenance signed by publish.yml on main
  - value: 7.7 / 10
    label: OpenSSF Scorecard (6.8 at release)
  - value: passing
    label: 'OpenSSF Best Practices badge: all 67 criteria met or not applicable'
  learned:
    lesson: The thing you tested should be the thing you ship.
    why: Rebuilding for prod means prod runs bytes nobody tested. Building once and promoting by digest, with signed provenance,
      means anyone can confirm that prod runs exactly what passed in dev. For a regulated customer that is the first question,
      and it maps directly to NIST SSDF PS.2 and PS.3.
  say:
  - Nothing is rebuilt for prod. The release workflow re-tags the digest main already built and tested; promotion is a small
    pull request that changes the tag and the digest.
  - 'Anyone can verify v0.2.0 without a registry login: online with `gh attestation verify`, or offline from the Sigstore
    bundle attached to the release.'
  - Every image has an SBOM and runs on amd64 and arm64.
  show:
  - label: v0.2.0 › How it shipped
    view: release
    anchor: rl-ship
  - label: 'Proof: anyone can verify v0.2.0'
    view: audit
    anchor: pf-verify-v0.2.0
  - label: Release v0.2.0
    href: https://github.com/Organized-AI/podcast-agent/releases/tag/v0.2.0
  run:
    cmd: gh attestation verify oci://ghcr.io/organized-ai/podcast-agent:v0.2.0 --repo Organized-AI/podcast-agent
    expect: '`Loaded digest sha256:67a18fc8…`, then `✓ Verification succeeded!`: one attestation, built and signed by `.github/workflows/publish.yml`
      on `main`.'
  ask:
  - q: How do you roll back?
    a: Revert the promotion pull request. Argo CD syncs dev back by itself; prod waits for a person to press Sync.
- title: 'Kubernetes: dev syncs itself on merge'
  live: true
  claim: Argo CD renders the Helm chart for each environment. Dev follows main by itself; prod waits for a person. Merging
    the deploy pull request is the deploy.
  facts:
  - value: 43 s
    label: 'from merging #55 to Argo CD''s automated sync'
  - value: '0'
    label: kubectl commands
  - value: '29'
    label: rendered resources pass kubeconform (default, dev, prod and Argo CD)
  - value: dev · prod
    label: one chart, two environments
  learned:
    lesson: Measure readiness before you measure change.
    why: 'My first lab watcher took its "before" snapshot while the pod was still pulling its image, and reported a sync
      that hadn''t happened. The fix was to wait for a ready pod and a Synced, Healthy app first, then watch for the image
      to change. Proving automation takes the same care as building it. The same goes for bot pull requests: one opened
      with the workflow''s own token runs no checks, so deploy PRs now come from a GitHub App.'
  say:
  - The deploy pull request is opened by a GitHub App, so its checks run like anyone's. Merging it is the deploy.
  - 'Earlier: #55 merged at 12:46:35Z, Argo CD started an automated sync at 12:47:18Z, and by 12:47:48Z `/healthz` reported
    the new commit. No one ran kubectl.'
  - The lab is a kind cluster on a Mac mini, reached over Tailscale with its own kubeconfig. CI installs the same Argo CD
    setup on a throwaway kind cluster for every deployment change.
  show:
  - label: FIG. 6 · Merge to cluster
    view: path
    anchor: gitops
  - label: 'Proof: dev synced on merge'
    view: audit
    anchor: pf-lab-sync
  - label: 'Deploy PR #56'
    href: https://github.com/Organized-AI/podcast-agent/pull/56
  run:
    cmd: 'curl -s http://jordans-mac-mini:30080/healthz      # note "commit"

      gh pr merge 56 --squash -R Organized-AI/podcast-agent

      open http://jordans-mac-mini:30090                 # Argo CD: watch dev sync

      curl -s http://jordans-mac-mini:30080/healthz      # "commit" is now the merged one'
    expect: '`/healthz` moves from the commit dev runs now to the one in #56''s title, once Argo CD has rolled the pod.
      After the demo, the next code merge to main opens the next deploy pull request by itself.'
  ask:
  - q: How does it scale?
    a: Workers are stateless. KEDA adds replicas as queue depth grows and scales to zero when idle. The real ceiling is
      the model provider's rate limit, which a gateway would enforce per model.
  - q: What runs in a customer's cluster?
    a: An API with an HPA and a PDB, workers scaled by KEDA, an ExternalSecret for the API keys, a NetworkPolicy, and a
      service account ready for IRSA (the role is set per customer), so pods reach AWS without static keys.
- title: 'Operate: one trace, two backends'
  live: true
  claim: Every run is one OpenTelemetry trace. The Collector sends it to Jaeger and MLflow, and CI proves that an MLflow
    outage doesn't cost Jaeger a span.
  facts:
  - value: 128 / 128
    label: spans in both Jaeger and MLflow for a full (offline) run
  - value: '37'
    label: queued spans delivered after an MLflow outage
  - value: '6'
    label: alert rules, unit-tested
  - value: '0'
    label: transcript text in spans, by default
  learned:
    lesson: If the agent only speaks OTLP, a new backend is a config change.
    why: 'Adding MLflow took no agent code, just one more exporter in the Collector. The surprises were all at the edges:
      MLflow needs a SQL store, it rejects unknown Host headers to stop DNS rebinding, and macOS holds port 5000. The outage
      test proves the property that matters: with MLflow down, Jaeger still gets every span, and MLflow gets its copy when
      it is back (the Collector retries for five minutes).'
  say:
  - 'Span names follow the GenAI semantic conventions, so a backend understands model calls, tools and tokens without custom
    parsing. MLflow shows the run as an agent: AGENT, CHAT_MODEL and TOOL spans, with token totals.'
  - I added MLflow after Joseph Fluckiger's AIMUG talk, where he showed it tracing LangGraph agents.
  - On every pull request CI stops MLflow, runs an episode and checks that Jaeger got all of it, then restarts MLflow and
    checks that the queued spans arrive.
  - Transcript text stays out of spans unless content capture is turned on, which matters when transcripts are confidential.
  show:
  - label: FIG. 5 · One trace
    view: path
    anchor: otel
  - label: 'Proof: Jaeger, MLflow and the outage'
    view: audit
    anchor: pf-otel-e2e-mac
  - label: Joseph Fluckiger's AIMUG talk
    href: https://www.youtube.com/watch?v=YPJd-RXsWI0
  run:
    cmd: 'make observe          # Collector, Jaeger, MLflow, Prometheus, Grafana; a traced run; checks both backends

      open http://127.0.0.1:5050   # MLflow: the run as an agent trace

      open http://127.0.0.1:16686  # Jaeger: the same trace id

      make observe-outage   # stop MLflow, run, check Jaeger; restart, check the queued spans'
    expect: Every check prints PASS; MLflow and Jaeger hold the same trace id with the same span count.
  ask:
  - q: Why two trace backends?
    a: Jaeger answers where the time went. MLflow shows the agent's run, its tokens and, with content capture on locally,
      each model call's messages. The agent exports once, so adding or dropping a backend is a Collector change.
  - q: Can prompts appear in traces for debugging?
    a: Locally, with `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true`. Inside a customer's boundary it stays off,
      and the Collector ships a drop-content processor to add to the traces pipeline as a second guard.
- title: Security for regulated customers
  claim: It's open-source software, not a service. It runs inside the customer's authorization boundary, and SECURITY.md
    is the evidence their assessor needs.
  facts:
  - value: '14'
    label: NIST SSDF 1.1 practices, each mapped to evidence
  - value: air-gapped
    label: a local model and the local knowledge base only
  - value: Bedrock
    label: model traffic stays in AWS, in the customer's region, under their IAM
  - value: by digest
    label: deploys pin a digest; its provenance can be verified before promotion
  learned:
    lesson: Security for a regulated customer is evidence, not adjectives.
    why: An assessor asks what was done, not what was intended. Mapping each NIST SSDF practice to a file, a workflow or
      a release asset, and saying plainly what isn't there (no ATO, no FIPS-validated base image, no built-in login), is
      more useful to them than a list of best practices.
  say:
  - 'Model traffic stays where the boundary allows: Bedrock in the customer''s region under their IAM, or a self-hosted,
    OpenAI-compatible server or Ollama.'
  - 'Air-gapped: a local model, `SEARCH_PROVIDER=none`, and verification from the dated knowledge base the customer controls.'
  - 'Deploy by digest and verify provenance before promoting; enforcing that at admission is the next step. Every run keeps
    hashes of its inputs and outputs, and the agent never publishes: a person reviews.'
  - 'What it doesn''t have: no FedRAMP authorization or ATO, no login on the API (put it behind SSO or mTLS), and a base
    image that isn''t FIPS-validated (rebuild on theirs).'
  show:
  - label: SECURITY.md › Regulated deployments
    href: https://github.com/Organized-AI/podcast-agent/blob/main/SECURITY.md#government-and-regulated-deployments
  - label: Learning path › Security and quality
    view: path
    anchor: m15
  - label: OpenSSF Best Practices
    href: https://www.bestpractices.dev/projects/15516
  ask:
  - q: What about prompt injection from a transcript or a web page?
    a: They're data, not instructions. The tools are read-only and allow-listed, so a malicious page can at worst sway a
      verdict, which a person reviews. It cannot trigger an action.
  - q: How do you keep data from leaving?
    a: 'The chart''s NetworkPolicy allows DNS, HTTPS and, when telemetry is on, the Collector''s port. (That last part was
      missing in prod until this walkthrough''s fact-check found it: #61.) Pinning destinations takes an egress gateway
      or an FQDN-aware CNI policy.'
- title: What isn't done, honestly
  claim: The gaps that remain need people, time, or a customer's environment.
  facts:
  - value: '3'
    label: bugs found by fact-checking this walkthrough, fixed the same day
  - value: '4'
    label: Scorecard checks only people or time can fix
  - value: designed
    label: provider failover, queue redrive, multi-region
  - value: kind
    label: the lab cluster; AWS is designed, not yet run
  learned:
    lesson: Fact-check the story, too.
    why: 'Checking every number in this walkthrough against the repository found three real bugs: the judge''s input (#51),
      prod''s NetworkPolicy blocking telemetry (#61), and a Docker quickstart that failed with an API key (#64). Each got
      an issue, a fix and a test. Some gaps need people rather than tools: a second reviewer, branch protection that requires
      one, and time.'
  say:
  - '#51: the judge said a summary invented speaker roles. The cause was the judge''s own input; the fix is merged, and
    the next live run confirms it.'
  - 'Scorecard: no second reviewer, branch protection can''t require one, the repository is under 90 days old, and every
    contributor is from one organization.'
  - 'Designed but not built: provider failover through a model gateway (Bedrock, then the Anthropic API, then a self-hosted
    model), SQS redrive, and multi-region recovery.'
  - The chart's AWS pieces (KEDA on SQS, ExternalSecrets, a service account ready for IRSA) are rendered and schema-checked
    on every change, but they haven't run on AWS.
  show:
  - label: v0.2.0 › What isn't done
    view: release
    anchor: rl-skip
  - label: OpenSSF Scorecard
    href: https://scorecard.dev/viewer/?uri=github.com/Organized-AI/podcast-agent
- title: What I'd build next
  claim: 'The next steps come from the cost model and the evals: cost first, then quality, then reach.'
  facts:
  - value: ≈ $0.17
    label: modeled per hour-long episode with 10 claims (the samples measured $0.05–$0.10)
  - value: ≈ $0.09
    label: with tiered verification
  - value: < $100
    label: a month of model spend at 500 episodes
  - value: '1'
    label: new step for audio and video in
  learned:
    lesson: Let the customer's numbers pick the next step.
    why: Verification is most of the token bill, so tiered verification is the first cost lever. At agency scale fixed infrastructure
      costs more than tokens, so the footprint should follow the client. The roadmap comes from the cost model and the evals,
      not from a feature list.
  say:
  - 'Tiered verification: run the claim loop on Haiku and escalate to Sonnet only for ⚠️ or low confidence.'
  - 'Observability inside the cluster: the Collector, Jaeger and MLflow as an Argo CD application, so cluster runs land
    in MLflow too, and the nightly judge''s scores attached to each run''s trace.'
  - 'A model gateway: per-tenant budgets, rate limits and provider failover.'
  - 'Audio and video in: speech-to-text with speaker labels in front of the pipeline, which doesn''t otherwise change.'
  show:
