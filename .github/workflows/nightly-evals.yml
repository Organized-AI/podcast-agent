# Nightly live evals with Claude: the labeled fact-check cases, a fresh run of every bundled transcript,
# and the rubric judge, gated by evals/suites/live.yaml and compared with evals/baselines/live.json.
# Skips cleanly (with a notice) when the repository has no ANTHROPIC_API_KEY secret.
name: nightly-evals
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-evals
  cancel-in-progress: false

jobs:
  live:
    name: Live evals (Claude)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set for this repository; skipping the live suite."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        if: steps.key.outputs.present == 'true'
        with:
          enable-cache: false   # a scheduled job with secrets never restores a cache another run wrote
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: uv sync --locked
      - name: Run the live suite
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          LLM_CACHE: "false"
        run: uv run podcast-agent eval --suite evals/suites/live.yaml --out evals/reports/live
      - name: Job summary
        if: always() && steps.key.outputs.present == 'true'
        run: '[ -f evals/reports/live/eval.md ] && cat evals/reports/live/eval.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: live-evals
          path: evals/reports/live
          retention-days: 30
