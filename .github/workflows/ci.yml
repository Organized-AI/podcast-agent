# The PR Gate: every pull request and every push to main runs these jobs; branch protection
# requires only the final "PR Gate" job, which fails if any job it depends on did not succeed.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra aws
      - name: Lint (ruff, with bandit rules)
        run: uv run ruff check src tests tools e2e fuzz
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests (hermetic, warnings are errors, coverage floor)
        run: uv run pytest -q --cov --cov-report=term
      - name: Drift (generated config, versions, lock)
        run: |
          uv run python tools/ci/gen_config.py --check
          uv run python tools/ci/check_version.py
          uv lock --check
      - name: Evals (offline suite; thresholds gate the job)
        run: |
          uv run podcast-agent eval --suite evals/suites/offline.yaml --out evals/reports/offline
          cat evals/reports/offline/eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: End-to-end run (offline provider) and audit
        run: |
          uv run podcast-agent run data/transcripts --out output --provider offline --quiet --today 2026-10-13
          uv run podcast-agent audit output
      - name: Re-audit the committed runs
        run: |
          uv run podcast-agent audit samples/claude-run --no-write
          uv run podcast-agent audit samples/offline-mode --no-write

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.8.0"
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.3.0
      - name: Install kubeconform (checksum verified)
        run: |
          curl -sSfL -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check -
          tar -xzf kubeconform.tgz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Lint, render and validate every environment (values schema + Kubernetes and CRD schemas)
        run: make helm

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA::7}" -t podcast-agent:ci .
      - name: Run every transcript offline in the container
        run: docker run --rm -e LLM_PROVIDER=offline podcast-agent:ci run data/transcripts --out /tmp/out --quiet
      - name: The quickstart's .env works in the container (its response-cache directory can be created)
        run: docker run --rm --env-file .env.example --entrypoint sh podcast-agent:ci -c 'mkdir -p "${LLM_CACHE_DIR:-/cache/llm}" && echo "cache dir ${LLM_CACHE_DIR:-/cache/llm} is writable"'

  observability:
    name: Observability stack
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Collector and Prometheus configs and unit-test the alert rules
        run: make observability-check
      - name: Run every transcript with telemetry on, then check Jaeger, MLflow and Prometheus received it
        run: |
          mkdir -p output && chmod 777 output   # the container writes as uid 10001
          make observe
      - name: Stop MLflow, check a run still reaches Jaeger, restart it, check the queued spans reach MLflow
        run: make observe-outage
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --profile observability logs --tail 80

  gate:
    name: PR Gate
    if: always()
    needs: [quality, helm, docker, observability]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
