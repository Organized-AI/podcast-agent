name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,aws]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: End-to-end run (offline provider, no secrets needed)
        run: podcast-agent run data/transcripts --out output --provider offline --quiet --today 2026-10-13

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/podcast-agent
      - run: helm template demo deploy/helm/podcast-agent > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t podcast-agent:ci .
      - run: docker run --rm -e LLM_PROVIDER=offline podcast-agent:ci run data/transcripts --out /tmp/out --quiet
