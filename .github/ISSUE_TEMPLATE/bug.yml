name: Bug report
description: Something produced a wrong result or failed
labels: ["type/bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what you saw. Paste the relevant lines of logs/run.log.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "`podcast-agent --version`, the image tag, or the git_commit in run_manifest.json"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [anthropic, bedrock, openai, ollama, offline]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed API keys and any confidential transcript text from this report
          required: true
